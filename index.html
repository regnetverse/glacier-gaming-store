<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Caption Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 2rem; border-radius: 1rem; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 1.4rem; margin-bottom: 1.2rem; color: #38bdf8; }
    input[type="text"], input[type="file"] { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; }
    .submit-btn { width: 100%; padding: 0.8rem; background: #10b981; border: none; color: white; border-radius: 0.5rem; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .submit-btn:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 1.2rem; font-size: 0.85rem; color: #94a3b8; line-height: 1.4; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <h1>⚡ Auto Caption Generator</h1>
  
  <input type="text" id="apiKey" placeholder="AssemblyAI API Key Paste Karo" />
  <input type="file" id="fileInput" accept="video/*,audio/*" />

  <button class="submit-btn" id="generateBtn" onclick="generateCaptions()">⚡ Generate SRT Captions</button>

  <div id="status">API Key daalo, file chuno aur generate dabao.</div>
</div>

<script>
  async function generateCaptions() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const btn = document.getElementById('generateBtn');

    if (!apiKey) { alert("Pehle AssemblyAI API Key daalo!"); return; }
    if (!fileInput.files.length) { alert("Pehle video/audio file select karo!"); return; }

    const file = fileInput.files[0];
    btn.disabled = true;

    try {
      // Step 1: Upload File
      status.innerText = "⏳ Step 1/3: File upload ho rahi hai...";
      const uploadRes = await fetch("https://api.assemblyai.com/v2/upload", {
        method: "POST",
        headers: { "authorization": apiKey },
        body: file
      });
      const uploadData = await uploadRes.json();
      if (!uploadData.upload_url) throw new Error(uploadData.error || "Upload failed");

      // Step 2: Request Transcription (Auto Language Detect)
      status.innerText = "⏳ Step 2/3: Audio transcribe ho raha hai...";
      const transcriptRes = await fetch("https://api.assemblyai.com/v2/transcript", {
        method: "POST",
        headers: {
          "authorization": apiKey,
          "content-type": "application/json"
        },
        body: JSON.stringify({
          audio_url: uploadData.upload_url,
          language_detection: true
        })
      });
      const transcriptData = await transcriptRes.json();
      const transcriptId = transcriptData.id;

      // Step 3: Poll for Completion
      let completed = false;
      while (!completed) {
        status.innerText = "⏳ Step 3/3: Captions processing chal rahi hai... (Wait 10-15s)";
        await new Promise(r => setTimeout(r, 3000));
        
        const pollRes = await fetch(`https://api.assemblyai.com/v2/transcript/${transcriptId}`, {
          headers: { "authorization": apiKey }
        });
        const pollData = await pollRes.json();

        if (pollData.status === "completed") {
          completed = true;
          
          // Fetch SRT Subtitles
          const srtRes = await fetch(`https://api.assemblyai.com/v2/transcript/${transcriptId}/srt`, {
            headers: { "authorization": apiKey }
          });
          const srtText = await srtRes.text();

          // Download SRT File
          const blob = new Blob([srtText], { type: "text/plain" });
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = `${file.name.split('.')[0]}_captions.srt`;
          document.body.appendChild(a);
          a.click();
          a.remove();

          status.innerText = "✅ SRT Caption file download ho chuki hai!";
        } else if (pollData.status === "error") {
          throw new Error(pollData.error);
        }
      }
    } catch (err) {
      status.innerText = "❌ Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
